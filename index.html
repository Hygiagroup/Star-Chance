<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Chance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Nunito:wght@400;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <header class="header">
    <div class="brand">
      <!-- TODO: swap for our logo (logo.svg) when design is done -->
      <span class="logo"><img src="img/sc_logor.png" alt="Logo"></span>
      <h1 data-text="name"></h1>
      <span class="tagline" data-text="tagline"></span>
    </div>
    <svg class="pulse" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true">
      <path pathLength="1" d="M0 20h50l8-14 10 28 9-20 6 6h117"/>
    </svg>
  </header>

  <p class="notice" data-text="notice"></p>

  <main>
    <!-- home -->
    <section class="view hero" id="view-home">
      <svg class="dna" viewBox="0 0 200 240" aria-hidden="true">
      <g class="rung" style="animation-delay: -0.0s"><line x1="55" y1="20" x2="145" y2="20"/><circle cx="55" cy="20" r="5"/><circle cx="145" cy="20" r="5"/></g>
      <g class="rung" style="animation-delay: -0.3s"><line x1="55" y1="38" x2="145" y2="38"/><circle cx="55" cy="38" r="5"/><circle cx="145" cy="38" r="5"/></g>
      <g class="rung" style="animation-delay: -0.6s"><line x1="55" y1="56" x2="145" y2="56"/><circle cx="55" cy="56" r="5"/><circle cx="145" cy="56" r="5"/></g>
      <g class="rung" style="animation-delay: -0.9s"><line x1="55" y1="74" x2="145" y2="74"/><circle cx="55" cy="74" r="5"/><circle cx="145" cy="74" r="5"/></g>
      <g class="rung" style="animation-delay: -1.2s"><line x1="55" y1="92" x2="145" y2="92"/><circle cx="55" cy="92" r="5"/><circle cx="145" cy="92" r="5"/></g>
      <g class="rung" style="animation-delay: -1.5s"><line x1="55" y1="110" x2="145" y2="110"/><circle cx="55" cy="110" r="5"/><circle cx="145" cy="110" r="5"/></g>
      <g class="rung" style="animation-delay: -1.8s"><line x1="55" y1="128" x2="145" y2="128"/><circle cx="55" cy="128" r="5"/><circle cx="145" cy="128" r="5"/></g>
      <g class="rung" style="animation-delay: -2.1s"><line x1="55" y1="146" x2="145" y2="146"/><circle cx="55" cy="146" r="5"/><circle cx="145" cy="146" r="5"/></g>
      <g class="rung" style="animation-delay: -2.4s"><line x1="55" y1="164" x2="145" y2="164"/><circle cx="55" cy="164" r="5"/><circle cx="145" cy="164" r="5"/></g>
      <g class="rung" style="animation-delay: -2.7s"><line x1="55" y1="182" x2="145" y2="182"/><circle cx="55" cy="182" r="5"/><circle cx="145" cy="182" r="5"/></g>
      <g class="rung" style="animation-delay: -3.0s"><line x1="55" y1="200" x2="145" y2="200"/><circle cx="55" cy="200" r="5"/><circle cx="145" cy="200" r="5"/></g>
      <g class="rung" style="animation-delay: -3.3s"><line x1="55" y1="218" x2="145" y2="218"/><circle cx="55" cy="218" r="5"/><circle cx="145" cy="218" r="5"/></g>
      </svg>
      <p class="eyebrow" data-text="homeEyebrow"></p>
      <h2 data-text="homeTitle"></h2>
      <p class="view-intro" data-text="homeText"></p>
      <div><button class="btn" type="button" data-go="body" data-text="homeButton"></button></div>
    </section>

    <!-- body map -->
    <section class="view" id="view-body" hidden>
      <p class="eyebrow" data-text="bodyEyebrow"></p>
      <h2 data-text="bodyTitle"></h2>
      <p class="view-intro" data-text="bodyText"></p>

      <div class="layer-tabs" id="layer-tabs"></div>

      <div class="body-map">
        <div class="figure">
          <!-- The three drawings are stacked (same size). The coordinates (viewBox) are the ones of the drawings,
               cropped around the body. Every clickable zone needs data-zone and the same name must exist in zones (content.js).
               The .hit shapes are invisible areas over the drawing: change x, y, width and height to move them. -->
          <svg class="body" viewBox="190 110 240 580" role="img" aria-label="Body diagram">
            <image class="layer" id="layer-skeletal" href="img/bones.svg" x="0" y="0" width="612" height="792"/>
            <image class="layer" id="layer-muscular" href="img/muscles.svg" x="0" y="0" width="612" height="792"/>
            <image class="layer" id="layer-organs" href="img/organs.svg" x="0" y="0" width="612" height="792"/>

            <g class="zones" data-layer="skeletal">
              <g class="zone" data-zone="bones" tabindex="0" role="button" aria-label="Bones">
                <rect class="hit" x="258" y="256" width="96" height="112" rx="20"/>
                <ellipse class="hit" cx="305" cy="396" rx="43" ry="26"/>
                <rect class="hit" x="256" y="426" width="34" height="240" rx="16"/>
                <rect class="hit" x="321" y="426" width="34" height="240" rx="16"/>
              </g>
            </g>

            <g class="zones" data-layer="muscular">
              <g class="zone" data-zone="muscles" tabindex="0" role="button" aria-label="Muscles">
                <rect class="hit" x="258" y="236" width="97" height="186" rx="22"/>
                <rect class="hit" x="218" y="248" width="30" height="164" rx="14"/>
                <rect class="hit" x="365" y="248" width="30" height="164" rx="14"/>
                <rect class="hit" x="260" y="434" width="36" height="216" rx="16"/>
                <rect class="hit" x="318" y="434" width="36" height="216" rx="16"/>
              </g>
            </g>

            <g class="zones" data-layer="organs">
              <g class="zone" data-zone="eyes" tabindex="0" role="button" aria-label="Eyes and brain">
                <ellipse class="hit" cx="306" cy="172" rx="45" ry="34"/>
              </g>
              <g class="zone" data-zone="heart" tabindex="0" role="button" aria-label="Heart">
                <ellipse class="hit" cx="315" cy="292" rx="21" ry="26"/>
              </g>
              <g class="zone" data-zone="kidneys" tabindex="0" role="button" aria-label="Kidneys">
                <ellipse class="hit" cx="276" cy="380" rx="22" ry="26"/>
                <ellipse class="hit" cx="337" cy="380" rx="22" ry="26"/>
              </g>
            </g>
          </svg>

          <!-- whole body: things that do not live in one place. They are made from zones with layer "whole" (content.js) -->
          <div class="whole">
            <span data-text="bodyWhole"></span>
            <div class="chips" id="whole"></div>
          </div>
        </div>

        <aside class="panel" id="panel" aria-live="polite">
          <p class="panel-empty" data-text="panelEmpty"></p>
        </aside>
      </div>
    </section>

    <!-- check-in: one vital sign per step, then a summary. Steps are made from vitals in content.js -->
    <section class="view" id="view-checkin" hidden>
      <p class="eyebrow" data-text="checkinEyebrow"></p>
      <h2 data-text="checkinTitle"></h2>
      <p class="view-intro" data-text="checkinText"></p>

      <div class="try">
        <span data-text="checkinTry"></span>
        <div class="chips" id="scenarios"></div>
      </div>

      <div class="steps" id="steps"></div>
      <div id="panels"></div>
    </section>

    <!-- risks, the cards are made from the risks list in content.js (not from zones) -->
    <section class="view" id="view-risks" hidden>
      <p class="eyebrow" data-text="risksEyebrow"></p>
      <h2 data-text="risksTitle"></h2>
      <p class="view-intro" data-text="risksText"></p>
      <div class="cards" id="cards"></div>
    </section>

    <!-- sources -->
    <section class="view" id="view-sources" hidden>
      <p class="eyebrow" data-text="sourcesEyebrow"></p>
      <h2 data-text="sourcesTitle"></h2>
      <ul class="source-list" id="source-list"></ul>

      <article class="card about">
        <h3 data-text="aboutWhyTitle"></h3>
        <p data-text="aboutWhy"></p>
        <h3 data-text="aboutNameTitle"></h3>
        <p data-text="aboutName"></p>
        <h3 data-text="aboutAITitle"></h3>
        <p data-text="aboutAI"></p>
        <p class="about-made" data-text="aboutMade"></p>
      </article>

    </section>
  </main>
</div>

<!-- bottom menu. data-go = the view it opens (view-<name>), max 5 buttons.
     icons are from lucide.dev. add class "sos" for an emergency button -->
<nav class="tabbar">
  <button class="tab active" type="button" data-go="home">
    <img src="img/home.png" alt="">
    <span data-text="menuHome"></span>
  </button>
  <button class="tab" type="button" data-go="body">
    <img src="img/body.png" alt="">
    <span data-text="menuBody"></span>
  </button>
  <button class="tab" type="button" data-go="checkin">
    <img src="img/electro.png" alt="">
    <span data-text="menuCheckin"></span>
  </button>
  <button class="tab" type="button" data-go="risks">
    <img src="img/danger.png" alt="">
    <span data-text="menuRisks"></span>
  </button>
  <button class="tab" type="button" data-go="sources">
    <img src="img/source.png" alt="">
    <span data-text="menuSources"></span>
  </button>
</nav>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
