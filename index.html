<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El título de la pestaña del navegador se cambia en contenido.js (PROYECTO.nombre) -->
  <title>"Star Chance"</title>
  <!-- Letras de Google Fonts (si cambian las letras, cambien también este enlace y --letra-titulos / --letra-texto en estilo.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- ============ ENCABEZADO (color principal, 30%) ============ -->
  <header class="encabezado">
    <div class="contenedor encabezado__fila">
      <!-- LOGO: cuando diseño entregue icono.svg, cambien src por "icono.svg" -->
      <a class="marca" href="#inicio">
        <span class="marca__logo" aria-hidden="true">★</span>
        <span class="marca__nombre" data-texto="nombre"></span>
      </a>
      <!-- El menú se llena solo desde contenido.js (SECCIONES) -->
      <nav class="menu" id="menu" aria-label="Main menu"></nav>
    </div>
  </header>

  <main>

    <!-- ============ SECCIÓN 1: INICIO ============ -->
    <section class="seccion inicio" id="inicio">
      <div class="contenedor">
        <h1 data-texto="titulo"></h1>
        <p class="inicio__frase" data-texto="frase"></p>
        <a class="boton" href="#mapa" data-texto="botonInicio"></a>
      </div>
    </section>

    <!-- ============ SECCIÓN 2: MAPA DEL CUERPO ============ -->
    <section class="seccion" id="mapa">
      <div class="contenedor">
        <h2 data-texto="tituloMapa"></h2>
        <p class="seccion__intro" data-texto="introMapa"></p>

        <div class="mapa">
          <!-- CUERPO: dibujo de ejemplo. Diseño lo reemplaza por su cuerpo.svg.
               REGLA: cada zona es un <g data-zona="..."> y ese nombre debe existir en ZONAS (contenido.js) -->
          <svg class="cuerpo" viewBox="0 0 400 900" role="img" aria-label="Body diagram">
            <!-- silueta (solo decorativa) -->
            <g class="cuerpo__silueta">
              <circle cx="200" cy="90" r="60"/>
              <rect x="140" y="160" width="120" height="260" rx="40"/>
              <rect x="70" y="170" width="55" height="260" rx="27"/>
              <rect x="275" y="170" width="55" height="260" rx="27"/>
              <rect x="145" y="410" width="50" height="420" rx="25"/>
              <rect x="205" y="410" width="50" height="420" rx="25"/>
            </g>
            <!-- zonas que se pueden tocar -->
            <g class="zona" data-zona="corazon" tabindex="0" role="button" aria-label="Heart">
              <ellipse cx="215" cy="235" rx="30" ry="34"/>
            </g>
            <g class="zona" data-zona="huesos" tabindex="0" role="button" aria-label="Bones">
              <rect x="150" y="560" width="40" height="230" rx="20"/>
            </g>
            <g class="zona" data-zona="defensas" tabindex="0" role="button" aria-label="Immune system">
              <rect x="160" y="300" width="80" height="70" rx="20"/>
            </g>
            <!-- Para agregar una zona: copien un bloque <g class="zona"...> y cambien data-zona -->
          </svg>

          <!-- Panel que muestra la información de la zona tocada (se llena con ZONAS) -->
          <aside class="panel" id="panel" aria-live="polite">
            <p class="panel__vacio" data-texto="panelVacio"></p>
          </aside>
        </div>
      </div>
    </section>

    <!-- ============ SECCIÓN 3: RIESGOS (tarjetas automáticas desde ZONAS) ============ -->
    <section class="seccion" id="riesgos">
      <div class="contenedor">
        <h2 data-texto="tituloRiesgos"></h2>
        <p class="seccion__intro" data-texto="introRiesgos"></p>
        <div class="tarjetas" id="tarjetas"></div>
      </div>
    </section>

    <!-- ============ SECCIÓN 4: FUENTES (lista automática desde FUENTES) ============ -->
    <section class="seccion" id="fuentes">
      <div class="contenedor">
        <h2 data-texto="tituloFuentes"></h2>
        <ul class="fuentes" id="listaFuentes"></ul>
      </div>
    </section>

  </main>

  <!-- ============ PIE (color oscuro, 10%) ============ -->
  <footer class="pie">
    <div class="contenedor">
      <p data-texto="aviso"></p>
    </div>
  </footer>

  <!-- Orden importante: primero los textos, después la lógica -->
  <script src="contenido.js"></script>
  <script src="app.js"></script>
</body>
</html>
